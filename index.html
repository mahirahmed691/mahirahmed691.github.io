<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Mahir Ahmed | Links</title>
  <meta name="description" content="Platform Engineer • DevOps • Building things that scale" />

  <!-- Open Graph -->
  <meta property="og:title" content="Mahir Ahmed | Links" />
  <meta property="og:description" content="Platform Engineer • DevOps • Building things that scale" />
  <meta property="og:image" content="https://mahirahmed691.github.io/profile.jpg" />
  <meta property="og:url" content="https://mahirahmed691.github.io" />

  <!-- Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-RDM6PMJJJC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag("js", new Date());
    gtag("config", "G-RDM6PMJJJC");
  </script>

  <style>
    body[data-theme="agate"] {
      --bg: #e8eadf;
      --text: #050505;
      --muted: #3f4038;
      --card: #ffffff;
      --card-hover: #f5f5f0;
      --border: #050505;
      --accent: #a3ff00;
      --accent2: #14b8a6;
      --radius: 28px;
      --shadow: 0 14px 30px rgba(0,0,0,.18);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px 14px;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      width: 100%;
      max-width: 460px;
      text-align: center;
    }

    .profile-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: var(--shadow);
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 24px;
    }

    .handle {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 8px;
    }

    .bio {
      font-size: 14px;
      color: var(--muted);
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      text-decoration: none;
      color: var(--text);
      box-shadow: var(--shadow);
      transition: 0.2s;
    }

    .link:hover {
      transform: translateY(-3px);
      background: var(--card-hover);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .action-btn {
      padding: 12px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--card);
      font-weight: bold;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--card);
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      opacity: 0;
      transition: 0.3s;
    }

    .toast.show {
      opacity: 1;
    }

    @media (max-width: 500px) {
      .actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body data-theme="agate">
  <main class="container">

    <section class="profile-card">
      <img class="avatar" src="profile.jpg" onerror="this.src='https://ui-avatars.com/api/?name=Mahir+Ahmed';" />
      <h1>Mahir Ahmed</h1>
      <p class="handle">@mahirahmed691</p>
      <p class="bio">Platform Engineer • DevOps • Building things that scale</p>
    </section>

    <section class="links" id="links"></section>

    <div class="actions">
      <button class="action-btn" onclick="copyEmail()">Copy Email</button>
      <button class="action-btn" onclick="sharePage()">Share Page</button>
    </div>

  </main>

  <script>
    const SITE_CONFIG = {
      theme: "agate",
      email: "mahirahmed691@gmail.com",
      shareUrl: "https://mahirahmed691.github.io"
    };

    const links = [
      { title: "GitHub", url: "https://github.com/mahirahmed691" },
      { title: "LinkedIn", url: "https://linkedin.com" },
      { title: "Instagram", url: "https://instagram.com" },
      { title: "Contact Me", url: "mailto:" + SITE_CONFIG.email }
    ];

    const linksContainer = document.getElementById("links");

    function renderLinks() {
      links.forEach(link => {
        const a = document.createElement("a");
        a.className = "link";
        a.href = link.url;
        a.target = "_blank";
        a.innerHTML = `${link.title} →`;
        linksContainer.appendChild(a);
      });
    }

    function setTheme(theme) {
      document.body.dataset.theme = theme;
    }

    function showToast(msg) {
      const t = document.createElement("div");
      t.className = "toast";
      t.innerText = msg;
      document.body.appendChild(t);
      setTimeout(() => t.classList.add("show"), 10);
      setTimeout(() => t.remove(), 2000);
    }

    function copyEmail() {
      navigator.clipboard.writeText(SITE_CONFIG.email);
      showToast("Email copied");
    }

    function sharePage() {
      navigator.clipboard.writeText(SITE_CONFIG.shareUrl);
      showToast("Link copied");
    }

    renderLinks();
    setTheme(SITE_CONFIG.theme);
  </script>
</body>
</html>
