<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Mahir Ahmed | Links</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;700;800&display=swap');

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{
  min-height:100vh;
  display:flex;justify-content:center;align-items:flex-start;
  padding:48px 16px 80px;
  font-family:'Inter',sans-serif;
  background:#0e1a2b;
  overflow-x:hidden;
  color:#e2e8f0;
}

/* ── Grid bg ── */
.grid-bg{
  position:fixed;inset:0;z-index:0;
  background-color:#0e1a2b;
  background-image:
    linear-gradient(rgba(0,255,136,.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,136,.06) 1px, transparent 1px);
  background-size:40px 40px;
}
.grid-bg::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 80% 60% at 50% 0%, rgba(0,212,255,.18) 0%, transparent 70%),
             radial-gradient(ellipse 50% 40% at 80% 60%, rgba(124,58,237,.14) 0%, transparent 60%),
             radial-gradient(ellipse 40% 50% at 10% 80%, rgba(0,255,136,.1) 0%, transparent 60%);
}

/* ── Scan line ── */
@keyframes scan{0%{top:-10%}100%{top:110%}}
.scanline{
  position:fixed;left:0;right:0;height:2px;z-index:1;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(0,255,136,.15),rgba(0,212,255,.2),rgba(0,255,136,.15),transparent);
  animation:scan 6s linear infinite;
  opacity:.6;
}

.container{position:relative;z-index:2;width:100%;max-width:580px;display:flex;flex-direction:column;align-items:center}

/* ── Terminal header ── */
.terminal-bar{
  width:100%;
  background:rgba(0,0,0,.6);
  border:1px solid rgba(0,255,136,.15);
  border-bottom:none;
  border-radius:10px 10px 0 0;
  padding:10px 14px;
  display:flex;align-items:center;gap:8px;
  margin-bottom:0;
  animation:fadeDown .5s cubic-bezier(.22,1,.36,1) both;
}
.dot{width:11px;height:11px;border-radius:50%}
.dot-r{background:#ff5f57}.dot-y{background:#febc2e}.dot-g{background:#28c840}
.terminal-title{
  flex:1;text-align:center;
  font-family:'JetBrains Mono',monospace;
  font-size:11px;color:rgba(255,255,255,.3);
  letter-spacing:.5px;
}

/* ── Profile card ── */
.profile-card{
  width:100%;
  background:rgba(6,10,15,.85);
  border:1px solid rgba(0,255,136,.15);
  border-top:none;
  border-bottom:1px solid rgba(0,255,136,.08);
  backdrop-filter:blur(20px);
  padding:28px 24px 24px;
  display:flex;flex-direction:column;align-items:center;
  animation:fadeDown .6s cubic-bezier(.22,1,.36,1) .05s both;
}

.avatar-wrap{position:relative;margin-bottom:16px}
.avatar-ring{
  padding:2px;border-radius:50%;
  background:conic-gradient(#00ff88,#00d4ff,#7c3aed,#00ff88);
}
.avatar-inner{padding:2px;border-radius:50%;background:#060a0f}
.avatar{display:block;width:84px;height:84px;border-radius:50%;object-fit:cover}
.status-dot{
  position:absolute;bottom:4px;right:4px;
  width:14px;height:14px;border-radius:50%;
  background:#00ff88;border:2px solid #060a0f;
  box-shadow:0 0 8px #00ff88;
  animation:pulse-dot 2s ease-in-out infinite;
}
@keyframes pulse-dot{0%,100%{box-shadow:0 0 6px #00ff88}50%{box-shadow:0 0 14px #00ff88,0 0 24px rgba(0,255,136,.4)}}

.name{font-size:20px;font-weight:800;color:#fff;letter-spacing:-.3px;margin-bottom:2px}
.handle{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;color:#00ff88;margin-bottom:10px;
}
.handle::before{content:'> '}

.badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.badge{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;font-weight:500;
  padding:3px 9px;border-radius:4px;
  border:1px solid;letter-spacing:.3px;
}
.badge-green{color:#00ff88;border-color:rgba(0,255,136,.3);background:rgba(0,255,136,.06)}
.badge-blue {color:#00d4ff;border-color:rgba(0,212,255,.3);background:rgba(0,212,255,.06)}
.badge-purple{color:#a78bfa;border-color:rgba(167,139,250,.3);background:rgba(167,139,250,.06)}

.bio{
  font-size:13px;color:rgba(255,255,255,.5);
  text-align:center;line-height:1.6;max-width:320px;
}

/* ── Social pills ── */
.social-row{
  display:flex;gap:8px;margin:20px 0 0;
  flex-wrap:wrap;justify-content:center;
}
.social-pill{
  display:flex;align-items:center;gap:6px;
  padding:6px 12px;border-radius:6px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);
  color:rgba(255,255,255,.5);
  text-decoration:none;
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  transition:all .2s;
}
.social-pill svg{width:13px;height:13px;fill:currentColor;flex-shrink:0}
.social-pill:hover{background:rgba(0,255,136,.07);border-color:rgba(0,255,136,.25);color:#00ff88;transform:translateY(-1px)}

/* ── Links ── */
.links-wrap{
  width:100%;
  background:rgba(6,10,15,.85);
  border:1px solid rgba(0,255,136,.12);
  border-top:none;
  backdrop-filter:blur(20px);
  padding:16px;
  display:flex;flex-direction:column;gap:8px;
  border-radius:0 0 10px 10px;
}

.section-label{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;color:rgba(0,255,136,.5);
  letter-spacing:1px;text-transform:uppercase;
  padding:4px 0 2px 4px;
  border-left:2px solid rgba(0,255,136,.3);
  margin-top:4px;
}
.section-label:first-child{margin-top:0}

.link{
  display:flex;align-items:center;gap:12px;
  padding:13px 14px;
  border-radius:8px;
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.07);
  text-decoration:none;color:#e2e8f0;
  transition:all .2s;
  animation:fadeUp .45s cubic-bezier(.22,1,.36,1) both;
  cursor:pointer;
  position:relative;overflow:hidden;
}
.link::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:2px;
  background:var(--accent,#00ff88);
  opacity:0;transition:opacity .2s;
  box-shadow:0 0 8px var(--accent,#00ff88);
}
.link:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12);transform:translateX(3px)}
.link:hover::before{opacity:1}
.link:active{transform:scale(.99)}

.icon-wrap{
  width:38px;height:38px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  border:1px solid rgba(255,255,255,.08);
}
.icon-wrap svg{width:18px;height:18px;fill:#fff}

.link-text{flex:1}
.link-name{display:block;font-size:14px;font-weight:700;color:#fff;letter-spacing:-.1px}
.link-sub{
  display:block;font-size:11px;
  font-family:'JetBrains Mono',monospace;
  color:rgba(255,255,255,.35);margin-top:1px;
}

.link-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.link-tag{
  font-family:'JetBrains Mono',monospace;
  font-size:9px;padding:2px 6px;border-radius:3px;
  border:1px solid;white-space:nowrap;
}
.arrow{color:rgba(255,255,255,.2);font-size:16px;transition:color .2s,transform .2s}
.link:hover .arrow{color:rgba(255,255,255,.6);transform:translateX(2px)}

/* brand accents */
.link[data-b="github"]    {--accent:#6e7681} .link[data-b="github"]    .icon-wrap{background:#161b22;border-color:#30363d}
.link[data-b="linkedin"]  {--accent:#0a66c2} .link[data-b="linkedin"]  .icon-wrap{background:#0a1929;border-color:#0a66c2}
.link[data-b="instagram"] {--accent:#e1306c} .link[data-b="instagram"] .icon-wrap{background:radial-gradient(circle at 30% 107%,#fdf497,#fd5949 45%,#d6249f 60%,#285aeb 90%);border:none}
.link[data-b="email"]     {--accent:#ea4335} .link[data-b="email"]     .icon-wrap{background:#1c0a09;border-color:#ea4335}
.link[data-b="portfolio"] {--accent:#00d4ff} .link[data-b="portfolio"] .icon-wrap{background:#000d14;border-color:#00d4ff}
.link[data-b="share"]     {--accent:#a78bfa} .link[data-b="share"]     .icon-wrap{background:#0d0b1c;border-color:#a78bfa}

.link[data-b="github"]    .link-tag{color:#6e7681;border-color:rgba(110,118,129,.3);background:rgba(110,118,129,.07)}
.link[data-b="linkedin"]  .link-tag{color:#0a66c2;border-color:rgba(10,102,194,.3);background:rgba(10,102,194,.07)}
.link[data-b="instagram"] .link-tag{color:#e1306c;border-color:rgba(225,48,108,.3);background:rgba(225,48,108,.07)}
.link[data-b="email"]     .link-tag{color:#ea4335;border-color:rgba(234,67,53,.3);background:rgba(234,67,53,.07)}
.link[data-b="portfolio"] .link-tag{color:#00d4ff;border-color:rgba(0,212,255,.3);background:rgba(0,212,255,.07)}
.link[data-b="share"]     .link-tag{color:#a78bfa;border-color:rgba(167,139,250,.3);background:rgba(167,139,250,.07)}

/* ── Footer ── */
.footer{
  margin-top:20px;
  font-family:'JetBrains Mono',monospace;
  font-size:10px;color:rgba(255,255,255,.15);
  animation:fadeUp .4s cubic-bezier(.22,1,.36,1) .5s both;
  display:flex;align-items:center;gap:8px;
}
.footer::before,.footer::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.06)}

/* ── Toast ── */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(12px);background:rgba(0,0,0,.85);border:1px solid rgba(0,255,136,.3);color:#00ff88;padding:9px 20px;border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:12px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:99;box-shadow:0 0 20px rgba(0,255,136,.15)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@keyframes fadeDown{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="scanline"></div>

<main class="container">

  <!-- terminal chrome -->
  <div class="terminal-bar">
    <span class="dot dot-r"></span>
    <span class="dot dot-y"></span>
    <span class="dot dot-g"></span>
    <span class="terminal-title">mahirahmed691 ~ links</span>
  </div>

  <!-- profile -->
  <div class="profile-card">
    <div class="avatar-wrap">
      <div class="avatar-ring">
        <div class="avatar-inner">
          <img class="avatar" src="profile.jpg" alt="Mahir Ahmed"
            onerror="this.src='https://ui-avatars.com/api/?name=Mahir+Ahmed&background=001a0d&color=00ff88&size=84'"/>
        </div>
      </div>
      <div class="status-dot" title="Available for work"></div>
    </div>
    <p class="name">Mahir Ahmed</p>
    <p class="handle">mahirahmed691</p>
    <div class="badges">
      <span class="badge badge-green">Platform Engineer</span>
      <span class="badge badge-blue">DevOps</span>
      <span class="badge badge-purple">AWS · Terraform</span>
    </div>
    <p class="bio">Building infrastructure that scales · Manchester, UK</p>
    <div class="social-row" id="social-row"></div>
  </div>

  <!-- links -->
  <div class="links-wrap">
    <p class="section-label">// projects</p>
    <div id="links-main"></div>
    <p class="section-label" style="margin-top:12px">// contact</p>
    <div id="links-contact"></div>
  </div>

  <p class="footer">© 2025 Mahir Ahmed</p>
</main>

<script>
const EMAIL = "mahirahmed691@gmail.com";
const SITE  = "https://mahirahmed691.github.io";

const SI = {
  github:   `<svg viewBox="0 0 24 24"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>`,
  linkedin: `<svg viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>`,
  instagram:`<svg viewBox="0 0 24 24"><path d="M12 0C8.74 0 8.333.015 7.053.072 5.775.132 4.905.333 4.14.63c-.789.306-1.459.717-2.126 1.384S.935 3.35.63 4.14C.333 4.905.131 5.775.072 7.053.012 8.333 0 8.74 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 2.16c3.203 0 3.585.016 4.85.071 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/></svg>`,
  gmail:    `<svg viewBox="0 0 24 24"><path d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.91 1.528-1.145C21.69 2.28 24 3.434 24 5.457z"/></svg>`,
  vercel:   `<svg viewBox="0 0 24 24"><path d="M24 22.525H0l12-21.05 12 21.05z"/></svg>`,
  share:    `<svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>`,
};

const mainLinks = [
  {b:"portfolio", name:"Portfolio",  sub:"mahirahmed.co.uk",       tag:"Next.js · Vercel", url:"https://www.mahirahmed.co.uk"},
  {b:"github",    name:"GitHub",     sub:"github.com/mahirahmed691",tag:"open source",      url:"https://github.com/mahirahmed691"},
  {b:"linkedin",  name:"LinkedIn",   sub:"in/mahirahmed691",        tag:"professional",     url:"https://linkedin.com/in/mahirahmed691"},
  {b:"instagram", name:"Instagram",  sub:"@mahirahmed691",          tag:"personal",         url:"https://instagram.com/mahirahmed691"},
];
const contactLinks = [
  {b:"email", name:"Email",  sub:EMAIL,       tag:"get in touch", url:"mailto:"+EMAIL},
  {b:"share", name:"Share",  sub:"copy link", tag:"clipboard",    action:true},
];
const socials = [
  {b:"github",    url:"https://github.com/mahirahmed691",      label:"GitHub"},
  {b:"linkedin",  url:"https://linkedin.com/in/mahirahmed691", label:"LinkedIn"},
  {b:"instagram", url:"https://instagram.com/mahirahmed691",   label:"Instagram"},
];

function mkLink(item, delay){
  const a = document.createElement("a");
  a.className="link"; a.dataset.b=item.b; a.style.animationDelay=delay+"s";
  if(item.action){
    a.href="#";
    a.addEventListener("click",e=>{e.preventDefault();copyLink()});
  } else {
    a.href=item.url; a.target="_blank"; a.rel="noopener noreferrer";
  }
  const icon = item.b==="email" ? SI.gmail : (item.b==="portfolio" ? SI.vercel : SI[item.b] || SI.share);
  a.innerHTML=`
    <span class="icon-wrap">${icon}</span>
    <span class="link-text">
      <span class="link-name">${item.name}</span>
      <span class="link-sub">${item.sub}</span>
    </span>
    <span class="link-meta">
      <span class="link-tag">${item.tag}</span>
      <span class="arrow">›</span>
    </span>`;
  return a;
}

const main = document.getElementById("links-main");
const contact = document.getElementById("links-contact");
mainLinks.forEach((l,i)=>main.appendChild(mkLink(l,i*.07+.2)));
contactLinks.forEach((l,i)=>contact.appendChild(mkLink(l,i*.07+.48)));

socials.forEach(s=>{
  const a=document.createElement("a");
  a.className="social-pill"; a.href=s.url; a.target="_blank"; a.rel="noopener noreferrer";
  a.setAttribute("aria-label",s.label);
  a.innerHTML=`${SI[s.b]} ${s.label}`;
  document.getElementById("social-row").appendChild(a);
});

function showToast(msg){
  document.querySelector(".toast")?.remove();
  const t=document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t);
  requestAnimationFrame(()=>requestAnimationFrame(()=>t.classList.add("show")));
  setTimeout(()=>{t.classList.remove("show");setTimeout(()=>t.remove(),300)},2400);
}
function copyLink(){
  navigator.clipboard.writeText(SITE).then(()=>showToast("// link copied to clipboard"));
}

/* Typing cursor blink on handle */
const h = document.querySelector(".handle");
let show = true;
setInterval(()=>{ h.style.opacity = (show=!show) ? 1 : .4 }, 600);
</script>
</body>
</html>
