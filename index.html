<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>🏠 Smart Household Inventory Pro with Tasks</title>
<style>
  :root {
    --bg: #fafafa;
    --fg: #222;
    --accent: #2a9d8f;
    --danger: #e76f51;
    --warning: #f4a261;
    --shadow: rgba(0,0,0,0.1);
    --light-bg: #fff;
    --dark-bg: #121212;
    --dark-fg: #ddd;
    --transition: 0.3s ease;
  }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: var(--bg);
    color: var(--fg);
    margin: 0;
    padding: 1rem;
    transition: background var(--transition), color var(--transition);
  }
  body.dark {
    background: var(--dark-bg);
    color: var(--dark-fg);
  }
  h1 {
    text-align: center;
    margin-bottom: 1rem;
    font-weight: 700;
  }
  .topbar {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    justify-content: center;
    margin-bottom: 1.5rem;
  }
  button, select, input[type="text"] {
    font-size: 1rem;
    padding: 0.4rem 0.75rem;
    border-radius: 6px;
    border: 1px solid #ccc;
    transition: background-color 0.2s ease;
  }
  button {
    cursor: pointer;
    border: none;
    background: var(--accent);
    color: white;
    font-weight: 600;
  }
  button:hover {
    background: #23867a;
  }
  button.danger {
    background: var(--danger);
  }
  button.danger:hover {
    background: #cc5b3e;
  }
  select {
    min-width: 180px;
  }
  input[type="text"] {
    width: 220px;
    border: 1px solid #ccc;
  }
  .section {
    background: var(--light-bg);
    border-radius: 12px;
    box-shadow: 0 4px 10px var(--shadow);
    margin-bottom: 1.8rem;
    transition: background var(--transition), color var(--transition);
  }
  body.dark .section {
    background: #1e1e1e;
  }
  .section h2 {
    cursor: pointer;
    user-select: none;
    margin: 0;
    padding: 1rem 1.25rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-weight: 700;
    font-size: 1.25rem;
    border-bottom: 1px solid #ddd;
    transition: border-color var(--transition);
  }
  body.dark .section h2 {
    border-color: #444;
  }
  .section h2 span.status-check {
    font-size: 1.2rem;
    color: var(--accent);
    user-select: none;
  }
  .section h2 .arrow {
    font-size: 1.3rem;
    transition: transform var(--transition);
    user-select: none;
  }
  .section.collapsed h2 .arrow {
    transform: rotate(-90deg);
  }
  ul {
    list-style: none;
    margin: 0;
    padding: 0 1.5rem 1rem 1.5rem;
    max-height: 1000px;
    overflow: hidden;
    transition: max-height var(--transition) ease;
  }
  .section.collapsed ul {
    max-height: 0;
    padding-bottom: 0;
  }
  li {
    display: flex;
    align-items: center;
    padding: 0.45rem 0;
    border-bottom: 1px solid #eee;
  }
  body.dark li {
    border-color: #444;
  }
  li label {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    user-select: none;
  }
  li label span {
    flex: 1;
    cursor: text;
    outline: none;
  }
  li label span:focus {
    background: #f0fdfa;
    border-radius: 4px;
  }
  li label input[type="checkbox"] {
    transform: scale(1.3);
    cursor: pointer;
  }
  li button {
    margin-left: 0.6rem;
    background: var(--danger);
    border: none;
    color: white;
    padding: 0.3rem 0.6rem;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s ease;
  }
  li button:hover {
    background: #cc5b3e;
  }
  .add-form, .search-box, .export-box, .category-manager, .undo-box {
    background: var(--light-bg);
    padding: 1.25rem 1.5rem;
    border-radius: 12px;
    box-shadow: 0 4px 10px var(--shadow);
    margin-bottom: 1.5rem;
    transition: background var(--transition), color var(--transition);
  }
  body.dark .add-form,
  body.dark .search-box,
  body.dark .export-box,
  body.dark .category-manager,
  body.dark .undo-box {
    background: #1e1e1e;
  }
  .add-form input[type="text"],
  .category-manager input[type="text"] {
    width: 240px;
    border-radius: 6px;
    border: 1px solid #ccc;
    padding: 0.45rem 0.6rem;
    font-size: 1rem;
    transition: border-color 0.2s ease;
  }
  .add-form input[type="text"]:focus,
  .category-manager input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
  }
  .category-list {
    margin-top: 0.8rem;
  }
  .category-list li {
    padding: 0.3rem 0;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    user-select: none;
  }
  .category-list li span {
    flex: 1;
    cursor: text;
    outline: none;
  }
  .category-list li span:focus {
    background: #f0fdfa;
    border-radius: 4px;
  }
  .category-list li button {
    background: #f4a261;
    border: none;
    color: white;
    padding: 0.25rem 0.5rem;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    transition: background-color 0.2s ease;
  }
  .category-list li button:hover {
    background: #db7c3a;
  }
  .toggle-dark {
    background: #444;
    padding: 0.3rem 1rem;
    border-radius: 6px;
    border: none;
    color: white;
    font-weight: 600;
  }
  .toggle-dark:hover {
    background: #666;
  }
  .drag-handle {
    cursor: grab;
    user-select: none;
    font-weight: 700;
    margin-right: 10px;
    color: #999;
    transition: color 0.2s ease;
  }
  .drag-handle:hover {
    color: var(--accent);
  }
  .undo-box button {
    background: #2a9d8f;
    border: none;
    color: white;
    padding: 0.45rem 1.2rem;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    transition: background-color 0.2s ease;
  }
  .undo-box button:hover {
    background: #23867a;
  }
  .hidden {
    display: none !important;
  }
  .due-date {
    font-size: 0.85rem;
    font-weight: 600;
    margin-left: 0.6rem;
    user-select: none;
    min-width: 80px;
    text-align: center;
    border-radius: 8px;
    padding: 0 6px;
    white-space: nowrap;
  }
  .due-date.overdue {
    color: white;
    background: var(--danger);
  }
  .due-date.upcoming {
    color: white;
    background: var(--warning);
  }
  .due-date-btn {
    background: none;
    border: none;
    cursor: pointer;
    margin-left: 0.6rem;
    font-size: 1.3rem;
    color: var(--accent);
    transition: color 0.2s ease;
  }
  .due-date-btn:hover {
    color: #1f776b;
  }
  #searchInput {
    border-radius: 8px;
  }
  #taskFilter {
    border-radius: 8px;
  }
</style>
</head>
<body>

<h1>🏠 Smart Household Inventory Pro with Tasks</h1>

<div class="topbar">
  <input type="text" id="searchInput" placeholder="Search items..." oninput="render()" />
  <select id="taskFilter" onchange="render()">
    <option value="all">Show: All Items</option>
    <option value="due">Due Soon / Overdue Tasks</option>
    <option value="overdue">Overdue Tasks Only</option>
  </select>
  <button onclick="toggleDarkMode()" class="toggle-dark" title="Toggle dark mode">🌓</button>
  <button onclick="undoDelete()" id="undoBtn" disabled title="Undo last delete">↩️ Undo</button>
  <button onclick="exportPDF()" title="Print / Export PDF">🖨️ Print/Export PDF</button>
  <button onclick="downloadBackup()" title="Backup JSON">⬇️ Backup</button>
  <button onclick="importBackup()" title="Import JSON">⬆️ Import</button>
</div>

<div id="container"></div>

<div class="add-form">
  <h2>Add New Item</h2>
  <input type="text" id="itemName" placeholder="Item name" />
  <select id="categorySelect"></select>
  <button onclick="addItem()">Add</button>
</div>

<div class="category-manager">
  <h2>Manage Categories</h2>
  <input type="text" id="newCategoryName" placeholder="New category name" />
  <button onclick="addCategory()">Add Category</button>
  <ul class="category-list" id="categoryList"></ul>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

<script>
const STORAGE_KEY = 'smart_inventory_pro';
const CHECKED_KEY = 'smart_inventory_checked';
const DELETED_KEY = 'smart_inventory_deleted';
const DUE_DATES_KEY = 'smart_inventory_due_dates';
const COLLAPSE_KEY = 'smart_inventory_collapsed';

let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
  "🏠 Household": ["Kitchen", "Sock holder", "Dehumidifier", "Bin bags", "Kitchen roll", "Floor cleaner"],
  "🧻 Bathroom": ["Toilet roll"],
  "📋 Household Tasks": ["Contact maintenance (fix bell)", "Ring Mark (light bulbs)"],
  "🛒 Groceries": [
    "🥩 Mixed beans (tin)", "Tuna", "Chicken breast", "Eggs",
    "🍞 Daal", "Bread", "Potatoes", "Wraps", "Crumpets", "Pasta",
    "🥬 Spring onion", "Coriander 🌿", "Garlic 🧄", "Lemon 🍋", "Lime 🍋",
    "🌶️ Panch phoron", "Bay leaves 🍃", "Cinnamon stick", "Cardamon", "Cajun", "Cayenne 🌶️",
    "🧂 Sandwich filling", "Tomato purée 🍅", "Garlic and ginger paste",
    "☕ Coffee", "Orange juice 🍊"
  ],
  "🐱 House Stuff": ["Cat biscuits", "Cat litter 🐱", "Bin Buddy 🗑️"]
};

let checkedItems = JSON.parse(localStorage.getItem(CHECKED_KEY) || '{}');
let deletedStack = JSON.parse(localStorage.getItem(DELETED_KEY) || '[]');
let dueDates = JSON.parse(localStorage.getItem(DUE_DATES_KEY) || '{}');
let collapsedState = JSON.parse(localStorage.getItem(COLLAPSE_KEY) || '{}');

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  localStorage.setItem(CHECKED_KEY, JSON.stringify(checkedItems));
  localStorage.setItem(DELETED_KEY, JSON.stringify(deletedStack));
  localStorage.setItem(DUE_DATES_KEY, JSON.stringify(dueDates));
  localStorage.setItem(COLLAPSE_KEY, JSON.stringify(collapsedState));
  document.getElementById('undoBtn').disabled = deletedStack.length === 0;
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d)) return '';
  return d.toLocaleDateString();
}
function isOverdue(dateStr) {
  if (!dateStr) return false;
  const d = new Date(dateStr);
  const now = new Date();
  now.setHours(0,0,0,0);
  return d < now;
}
function isUpcoming(dateStr) {
  if (!dateStr) return false;
  const now = new Date();
  const due = new Date(dateStr);
  const diff = due - now;
  return diff >= 0 && diff <= 3*24*60*60*1000; // 3 days
}

function requestNotificationPermission() {
  if (!("Notification" in window)) return;
  if (Notification.permission === "default") {
    Notification.requestPermission();
  }
}

function notifyDueTasks() {
  if (Notification.permission !== "granted") return;
  for (const [cat, items] of Object.entries(state)) {
    if (cat !== '📋 Household Tasks') continue;
    for (const item of items) {
      const due = dueDates[item];
      if (!due) continue;
      const dueDateObj = new Date(due);
      const now = new Date();
      const diff = dueDateObj - now;
      if (diff > 0 && diff <= 60*60*1000) {
        new Notification(`Reminder: "${item}" is due soon!`);
      }
    }
  }
}

function toggleCollapse(cat) {
  collapsedState[cat] = !collapsedState[cat];
  save();
  render();
}

function render() {
  const container = document.getElementById('container');
  const search = document.getElementById('searchInput').value.toLowerCase();
  const filter = document.getElementById('taskFilter').value;
  container.innerHTML = '';

  for (const [cat, items] of Object.entries(state)) {
    if (filter !== 'all' && cat !== '📋 Household Tasks') continue;

    const filteredItems = items.filter(item => {
      if (search && !item.toLowerCase().includes(search)) return false;
      if (filter === 'due') return dueDates[item] && (isUpcoming(dueDates[item]) || isOverdue(dueDates[item]));
      if (filter === 'overdue') return dueDates[item] && isOverdue(dueDates[item]);
      return true;
    });

    if (filteredItems.length === 0) continue;

    const section = document.createElement('div');
    section.className = 'section';
    const allChecked = filteredItems.length > 0 && filteredItems.every(item => checkedItems[item]);
    if (allChecked) section.classList.add('completed');
    if (collapsedState[cat]) section.classList.add('collapsed');

    // Header with collapsible arrow and status check
    const header = document.createElement('h2');
    header.innerHTML = `
      <span>${cat}</span>
      <div>
        <span class="status-check">${allChecked ? '✅' : ''}</span>
        <span class="arrow">${collapsedState[cat] ? '▶' : '▼'}</span>
      </div>
    `;
    header.onclick = () => toggleCollapse(cat);
    section.appendChild(header);

    const ul = document.createElement('ul');

    filteredItems.forEach((item) => {
      const li = document.createElement('li');

      const label = document.createElement('label');

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = !!checkedItems[item];
      checkbox.onchange = () => {
        checkedItems[item] = checkbox.checked;
        save();
        render();
      };

      const span = document.createElement('span');
      span.textContent = item;
      span.contentEditable = true;
      span.spellcheck = false;
      span.onblur = () => {
        const newText = span.textContent.trim();
        if (!newText) {
          alert('Item name cannot be empty!');
          span.textContent = item;
          return;
        }
        if (newText !== item) {
          const idx = state[cat].indexOf(item);
          if (idx !== -1) {
            state[cat][idx] = newText;
            if (checkedItems[item]) {
              checkedItems[newText] = checkedItems[item];
              delete checkedItems[item];
            }
            if (dueDates[item]) {
              dueDates[newText] = dueDates[item];
              delete dueDates[item];
            }
            save();
            render();
          }
        }
      };

      label.appendChild(checkbox);
      label.appendChild(span);

      if (cat === '📋 Household Tasks') {
        const dueDateText = document.createElement('span');
        dueDateText.className = 'due-date';
        const due = dueDates[item];
        if (due) {
          dueDateText.textContent = formatDate(due);
          if (isOverdue(due)) dueDateText.classList.add('overdue');
          else if (isUpcoming(due)) dueDateText.classList.add('upcoming');
        } else {
          dueDateText.textContent = '-';
          dueDateText.style.color = '#888';
        }
        label.appendChild(dueDateText);

        const dueBtn = document.createElement('button');
        dueBtn.className = 'due-date-btn';
        dueBtn.title = 'Set due date (YYYY-MM-DD)';
        dueBtn.textContent = '📅';
        dueBtn.onclick = (e) => {
          e.stopPropagation();
          const newDue = prompt('Enter due date (YYYY-MM-DD) or leave empty to clear:', due || '');
          if (newDue === null) return;
          if (newDue.trim() === '') {
            delete dueDates[item];
          } else if (!/^\d{4}-\d{2}-\d{2}$/.test(newDue)) {
            alert('Invalid date format! Use YYYY-MM-DD.');
            return;
          } else {
            dueDates[item] = newDue;
          }
          save();
          render();
        };
        label.appendChild(dueBtn);
      }

      li.appendChild(label);

      const delBtn = document.createElement('button');
      delBtn.textContent = 'Delete';
      delBtn.title = 'Delete this item';
      delBtn.onclick = () => {
        if (confirm(`Delete item "${item}"?`)) {
          deletedStack.push({ cat, item, checked: !!checkedItems[item], due: dueDates[item] });
          const index = state[cat].indexOf(item);
          if (index !== -1) state[cat].splice(index, 1);
          delete checkedItems[item];
          delete dueDates[item];
          save();
          render();
        }
      };
      li.appendChild(delBtn);

      ul.appendChild(li);
    });

    section.appendChild(ul);
    container.appendChild(section);
  }

  // Fill category select dropdown
  const select = document.getElementById('categorySelect');
  select.innerHTML = '';
  for (const cat of Object.keys(state)) {
    const opt = document.createElement('option');
    opt.value = cat;
    opt.textContent = cat;
    select.appendChild(opt);
  }

  // Render category manager
  renderCategoryManager();

  initSortable();
}

function addItem() {
  const nameInput = document.getElementById('itemName');
  const catSelect = document.getElementById('categorySelect');
  const name = nameInput.value.trim();
  const cat = catSelect.value;

  if (!name) {
    alert('Item name cannot be empty!');
    return;
  }

  if (!state[cat]) {
    alert('Category does not exist!');
    return;
  }

  if (state[cat].includes(name)) {
    alert('Item already exists in this category!');
    return;
  }

  state[cat].push(name);
  nameInput.value = '';
  save();
  render();
}

function addCategory() {
  const input = document.getElementById('newCategoryName');
  const newCat = input.value.trim();
  if (!newCat) {
    alert('Category name cannot be empty!');
    return;
  }
  if (state[newCat]) {
    alert('Category already exists!');
    return;
  }
  state[newCat] = [];
  input.value = '';
  save();
  render();
}

function renderCategoryManager() {
  const list = document.getElementById('categoryList');
  list.innerHTML = '';

  for (const cat of Object.keys(state)) {
    const li = document.createElement('li');

    const drag = document.createElement('span');
    drag.className = 'drag-handle';
    drag.textContent = '☰';
    li.appendChild(drag);

    const span = document.createElement('span');
    span.textContent = cat;
    span.contentEditable = true;
    span.spellcheck = false;
    span.onblur = () => {
      const newName = span.textContent.trim();
      if (!newName) {
        alert('Category name cannot be empty!');
        span.textContent = cat;
        return;
      }
      if (newName !== cat) {
        if (state[newName]) {
          alert('Category name already exists!');
          span.textContent = cat;
          return;
        }
        state[newName] = state[cat];
        delete state[cat];

        // Update checkedItems & dueDates keys for renamed category items
        for (const item of state[newName]) {
          if (checkedItems[item]) checkedItems[item] = checkedItems[item];
          if (dueDates[item]) dueDates[newName] = dueDates[newName];
        }
        save();
        render();
      }
    };
    li.appendChild(span);

    const del = document.createElement('button');
    del.textContent = 'Delete';
    del.title = 'Delete this category and all its items';
    del.onclick = () => {
      if (confirm(`Delete category "${cat}" and all its items?`)) {
        for (const item of state[cat]) {
          delete checkedItems[item];
          delete dueDates[item];
        }
        delete state[cat];
        save();
        render();
      }
    };
    li.appendChild(del);

    list.appendChild(li);
  }

  new Sortable(list, {
    animation: 150,
    handle: '.drag-handle',
    onEnd: evt => {
      const keys = Object.keys(state);
      const moved = keys.splice(evt.oldIndex, 1)[0];
      keys.splice(evt.newIndex, 0, moved);

      const newState = {};
      for (const k of keys) newState[k] = state[k];
      state = newState;
      save();
      render();
    }
  });
}

function undoDelete() {
  if (deletedStack.length === 0) return;
  const last = deletedStack.pop();
  if (!state[last.cat]) state[last.cat] = [];
  state[last.cat].push(last.item);
  if (last.checked) checkedItems[last.item] = true;
  if (last.due) dueDates[last.item] = last.due;
  save();
  render();
}

function downloadBackup() {
  const backup = { state, checkedItems, deletedStack, dueDates, collapsedState };
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backup));
  const a = document.createElement('a');
  a.href = dataStr;
  a.download = 'inventory_backup_' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function importBackup() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = evt => {
      try {
        const data = JSON.parse(evt.target.result);
        if (data.state && data.checkedItems) {
          state = data.state;
          checkedItems = data.checkedItems;
          deletedStack = data.deletedStack || [];
          dueDates = data.dueDates || {};
          collapsedState = data.collapsedState || {};
          save();
          render();
          alert('Backup imported successfully!');
        } else {
          alert('Invalid backup file.');
        }
      } catch {
        alert('Error reading backup file.');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function exportPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = 10;
  doc.setFontSize(18);
  doc.text('🏠 Smart Household Inventory Pro', 10, y);
  y += 10;
  doc.setFontSize(12);

  for (const [cat, items] of Object.entries(state)) {
    if (items.length === 0) continue;
    doc.setTextColor(40, 40, 40);
    doc.setFont(undefined, 'bold');
    doc.text(cat, 10, y);
    y += 8;
    doc.setFont(undefined, 'normal');
    for (const item of items) {
      if (y > 280) {
        doc.addPage();
        y = 10;
      }
      const checkedMark = checkedItems[item] ? '✅ ' : '⬜ ';
      let dueStr = '';
      if (dueDates[item]) dueStr = ' (Due: ' + formatDate(dueDates[item]) + ')';
      doc.text(checkedMark + item + dueStr, 15, y);
      y += 7;
    }
    y += 5;
  }
  doc.save('inventory.pdf');
}

function toggleDarkMode() {
  document.body.classList.toggle('dark');
  if (document.body.classList.contains('dark')) {
    localStorage.setItem('darkMode', 'true');
  } else {
    localStorage.removeItem('darkMode');
  }
}

function restoreDarkMode() {
  if (localStorage.getItem('darkMode')) {
    document.body.classList.add('dark');
  }
}

function initSortable() {
  document.querySelectorAll('.section ul').forEach(ul => {
    new Sortable(ul, {
      animation: 150,
      handle: 'label',
      onEnd: evt => {
        const cat = evt.to.parentElement.querySelector('h2').textContent.replace(' ✅', '').trim();
        if (!state[cat]) return;
        const reordered = [];
        evt.to.querySelectorAll('li label span:first-child').forEach(span => reordered.push(span.textContent));
        reordered.length = 0;
        evt.to.querySelectorAll('li label span').forEach(span => reordered.push(span.textContent));
        state[cat] = reordered;
        save();
        render();
      }
    });
  });
}

window.onload = () => {
  restoreDarkMode();
  requestNotificationPermission();
  render();
  document.getElementById('undoBtn').disabled = deletedStack.length === 0;
  setInterval(notifyDueTasks, 60000); // check every minute
};
</script>
</body>
</html>
