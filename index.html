<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mahir Ahmed</title>

  <style>
    :root {
      --bg: #0f0f10;
      --card: #1a1a1d;
      --card-hover: #222226;
      --text: #ffffff;
      --muted: #a1a1aa;
      --accent: #6366f1;
      --accent-2: #a855f7;
      --border: #27272a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(99, 102, 241, 0.25), transparent 35%),
        var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      text-align: center;
      opacity: 0;
      transform: translateY(12px);
      animation: fadeIn 0.6s ease forwards;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .profile {
      margin-bottom: 28px;
    }

    .avatar {
      width: 94px;
      height: 94px;
      border-radius: 50%;
      margin: 0 auto 16px;
      object-fit: cover;
      border: 2px solid var(--border);
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }

    h1 {
      font-size: 24px;
      margin-bottom: 6px;
    }

    .handle {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 10px;
    }

    .bio {
      color: var(--muted);
      font-size: 14px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link {
      width: 100%;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 15px 16px;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .link:hover {
      transform: translateY(-2px);
      background: var(--card-hover);
      border-color: var(--accent);
    }

    .link-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .link-icon {
      width: 28px;
      height: 28px;
      border-radius: 9px;
      background: rgba(99, 102, 241, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .featured {
      border-color: var(--accent);
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.2);
    }

    /* 🔥 Features Section */
    .features {
      margin-top: 28px;
      text-align: left;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
    }

    .features h2 {
      font-size: 18px;
      margin-bottom: 16px;
    }

    .feature-group {
      margin-bottom: 18px;
    }

    .feature-group:last-child {
      margin-bottom: 0;
    }

    .feature-group h3 {
      color: var(--accent-2);
      font-size: 15px;
      margin-bottom: 10px;
    }

    .feature-item {
      font-size: 14px;
      margin-bottom: 8px;
    }

    .footer {
      margin-top: 28px;
      color: var(--muted);
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="profile">
      <!-- Replace with your real image later -->
      <img class="avatar" src="https://via.placeholder.com/150" />
      <h1>Mahir Ahmed</h1>
      <p class="handle">@mahirahmed691</p>
      <p class="bio">Platform Engineer • DevOps • Building things that scale</p>
    </div>

    <div class="links" id="links"></div>

    <!-- 🔥 Features UI -->
    <section class="features">
      <h2>Features</h2>

      <div class="feature-group">
        <h3>Link in Bio</h3>
        <div class="feature-item">✅ Comprehensive analytics</div>
      </div>

      <div class="feature-group">
        <h3>Growth Tools</h3>
        <div class="feature-item">✅ Social posts</div>
        <div class="feature-item">✅ Instagram DMs</div>
      </div>

      <div class="feature-group">
        <h3>Make Money</h3>
        <div class="feature-item">✅ Affiliate shop</div>
      </div>

      <div class="feature-group">
        <h3>Priority Support</h3>
        <div class="feature-item">✅ Contact / onboarding</div>
      </div>
    </section>

    <div class="footer">
      © 2026 Mahir Ahmed
    </div>

  </div>

  <script>
    const links = [
      {
        title: "GitHub",
        url: "https://github.com/mahirahmed691",
        icon: "💻",
        featured: true
      },
      {
        title: "LinkedIn",
        url: "https://www.linkedin.com/in/mahir-ahmed-84a346149",
        icon: "💼"
      },
      {
        title: "Contact Me",
        url: "mailto:mahirahmed691@gmail.com",
        icon: "✉️"
      }
    ];

    const container = document.getElementById("links");

    links.forEach(link => {
      const a = document.createElement("a");
      a.className = link.featured ? "link featured" : "link";
      a.href = link.url;
      a.target = link.url.startsWith("mailto:") ? "_self" : "_blank";

      a.innerHTML = `
        <span class="link-left">
          <span class="link-icon">${link.icon}</span>
          <span>${link.title}</span>
        </span>
        <span>→</span>
      `;

      container.appendChild(a);
    });
  </script>

</body>
</html>
