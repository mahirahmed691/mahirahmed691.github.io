<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mahir Ahmed | Links</title>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-RDM6PMJJJC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());
    gtag("config", "G-RDM6PMJJJC");
  </script>

  <style>
    /* ========= THEMES ========= */

    body[data-theme="midnight"] {
      --bg:#050505;
      --text:#fff;
      --muted:#aaa;
      --card:rgba(255,255,255,0.08);
      --card-hover:rgba(255,255,255,0.15);
      --border:rgba(255,255,255,0.15);
      --accent:#8b5cf6;
      --radius:20px;
      --shadow:0 20px 60px rgba(99,102,241,0.25);
    }

    body[data-theme="linktree"] {
      --bg:#39e09b;
      --text:#111;
      --muted:#174632;
      --card:#111;
      --card-hover:#222;
      --link-text:#fff;
      --border:#111;
      --accent:#111;
      --radius:999px;
      --shadow:6px 6px 0 #111;
    }

    body[data-theme="cyber"] {
      --bg:#020617;
      --text:#d1fae5;
      --muted:#86efac;
      --card:rgba(0,255,128,0.08);
      --card-hover:rgba(0,255,128,0.16);
      --border:rgba(34,197,94,0.4);
      --accent:#22c55e;
      --radius:8px;
      --shadow:0 0 30px rgba(34,197,94,0.3);
    }

    body[data-theme="clean"] {
      --bg:#f7f7f2;
      --text:#111;
      --muted:#666;
      --card:#fff;
      --card-hover:#f1f1f1;
      --border:#e5e7eb;
      --accent:#111;
      --radius:18px;
      --shadow:0 15px 40px rgba(0,0,0,0.08);
    }

    body[data-theme="sunset"] {
      --bg:#2b1055;
      --text:#fff;
      --muted:#f8d7ff;
      --card:rgba(255,255,255,0.12);
      --card-hover:rgba(255,255,255,0.22);
      --border:rgba(255,255,255,0.2);
      --accent:#ff7a59;
      --radius:28px;
      --shadow:0 20px 50px rgba(255,122,89,0.3);
    }

    /* ========= BASE ========= */

    * {
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:-apple-system,Segoe UI,Roboto;
    }

    body {
      min-height:100vh;
      display:flex;
      justify-content:center;
      padding:30px 15px;
      background:var(--bg);
      color:var(--text);
      overflow-x:hidden;
    }

    /* Background animation */
    body::before {
      content:"";
      position:fixed;
      inset:-50%;
      background:
        radial-gradient(circle, rgba(255,255,255,0.08), transparent 25%),
        radial-gradient(circle, rgba(139,92,246,0.18), transparent 30%);
      animation:floatBg 20s linear infinite;
      z-index:-1;
    }

    @keyframes floatBg {
      from {transform:translate(0,0) rotate(0);}
      to {transform:translate(60px,-60px) rotate(360deg);}
    }

    .container {
      max-width:450px;
      width:100%;
      text-align:center;
      animation:fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from {opacity:0; transform:translateY(20px);}
      to {opacity:1; transform:translateY(0);}
    }

    /* ========= PROFILE ========= */

    .avatar {
      width:110px;
      height:110px;
      border-radius:50%;
      object-fit:cover;
      border:3px solid var(--border);
      margin-bottom:12px;
      box-shadow:var(--shadow);
      animation:avatarFloat 4s ease-in-out infinite;
    }

    @keyframes avatarFloat {
      0%,100% {transform:translateY(0);}
      50% {transform:translateY(-6px);}
    }

    h1 {font-size:26px;margin-bottom:6px;}
    .handle {color:var(--muted);margin-bottom:10px;}
    .bio {color:var(--muted);margin-bottom:20px;font-size:14px;}

    /* ========= THEMES ========= */

    .theme-switcher {
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:8px;
      margin-bottom:20px;
    }

    .theme-btn {
      padding:6px;
      border-radius:999px;
      border:1px solid var(--border);
      background:var(--card);
      cursor:pointer;
      font-size:10px;
    }

    .theme-btn:hover {
      border-color:var(--accent);
    }

    /* ========= LINKS ========= */

    .links {
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .link {
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:16px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      text-decoration:none;
      color:var(--link-text,var(--text));
      font-weight:700;
      box-shadow:var(--shadow);
      animation:linkEnter 0.4s ease both;
    }

    .link:nth-child(1){animation-delay:.1s;}
    .link:nth-child(2){animation-delay:.2s;}
    .link:nth-child(3){animation-delay:.3s;}
    .link:nth-child(4){animation-delay:.4s;}

    @keyframes linkEnter {
      from {opacity:0; transform:translateY(10px);}
      to {opacity:1; transform:translateY(0);}
    }

    .link:hover {
      transform:translateY(-2px);
      background:var(--card-hover);
      border-color:var(--accent);
    }

    .footer {
      margin-top:24px;
      color:var(--muted);
      font-size:12px;
    }

  </style>
</head>

<body data-theme="midnight">

<div class="container">

  <img class="avatar" src="profile.jpg"/>

  <h1>Mahir Ahmed</h1>
  <p class="handle">@mahirahmed691</p>
  <p class="bio">Platform Engineer • DevOps</p>

  <div class="theme-switcher">
    <button onclick="setTheme('midnight')">Midnight</button>
    <button onclick="setTheme('linktree')">Linktree</button>
    <button onclick="setTheme('cyber')">Cyber</button>
    <button onclick="setTheme('clean')">Clean</button>
    <button onclick="setTheme('sunset')">Sunset</button>
  </div>

  <div id="links" class="links"></div>

  <div class="footer">© 2026 Mahir Ahmed</div>

</div>

<script>
const links = [
  {title:"GitHub",url:"https://github.com/mahirahmed691"},
  {title:"LinkedIn",url:"https://www.linkedin.com/in/mahir-ahmed-84a346149"},
  {title:"Instagram",url:"https://www.instagram.com/mahirahmed691"},
  {title:"Contact",url:"mailto:mahirahmed691@gmail.com"}
];

const container = document.getElementById("links");

links.forEach(link=>{
  const a=document.createElement("a");
  a.className="link";
  a.href=link.url;
  a.target="_blank";
  a.innerHTML=`${link.title} <span>→</span>`;

  a.onclick=()=>gtag("event","link_click",{link_name:link.title});

  container.appendChild(a);
});

function setTheme(t){
  document.body.dataset.theme=t;
  localStorage.setItem("theme",t);
}

setTheme(localStorage.getItem("theme")||"midnight");
</script>

</body>
</html>
