<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HomeHive</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <!-- SortableJS for drag/drop -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
</head>
<body>

  <!-- Topbar -->
  <div class="topbar">
    <div class="topbar-left">
      <img src="./assets/logo.png" alt="HomeHive Logo" width="auto" height="60" />
    </div>

    <div class="topbar-center">
      <input class="searchCategory" type="text" id="searchInput" placeholder="Search items..." oninput="render()" />
    </div>

    <div class="topbar-right">
      <label class="theme-toggle" title="Toggle dark mode">
        <input type="checkbox" id="darkModeSwitch" />
        <span class="slider"></span>
      </label>
    </div>

  </div>

  <!-- Main container -->
  <div id="container"></div>

  <!-- FAB + Menu -->
 <div class="fab-container">
  <div class="fab" onclick="toggleFabMenu()">＋</div>
  <div id="fabMenu" class="fab-menu hidden">
    <button onclick="openCategoryModal()">➕ Create Category</button>
    <button onclick="openTaskModal()">📝 Add Task to Category</button>
  </div>
</div>


 <!-- Modal Overlay -->
<div id="modalOverlay" class="modal-overlay hidden"></div>

<!-- Modal Container -->
<div id="modal" class="modal hidden">
  <h2 id="modalTitle"></h2>
  
  <div id="modalContent">
    <!-- Dynamic content goes here -->
  </div>
  
  <div class="modal-buttons">
    <button id="modalCancelBtn">Cancel</button>
    <button id="modalSubmitBtn">Add</button>
  </div>
</div>


 <script type="module" src="app.js"></script>


</body>
</html>
