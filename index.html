<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mahir Ahmed | Links</title>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-RDM6PMJJJC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());
    gtag("config", "G-RDM6PMJJJC");
  </script>

  <style>
    /* ================= THEMES ================= */

    body[data-theme="midnight"] {
      --bg: #050505;
      --text: #ffffff;
      --muted: #a1a1aa;
      --card: rgba(255,255,255,0.08);
      --card-hover: rgba(255,255,255,0.15);
      --border: rgba(255,255,255,0.16);
      --accent: #8b5cf6;
      --radius: 20px;
      --avatar-radius: 50%;
      --shadow: 0 20px 60px rgba(99,102,241,0.25);
    }

    body[data-theme="linktree"] {
      --bg: #39e09b;
      --text: #111;
      --muted: #174632;
      --card: #111;
      --card-hover: #242424;
      --link-text: #fff;
      --border: #111;
      --accent: #111;
      --radius: 999px;
      --avatar-radius: 50%;
      --shadow: 6px 6px 0 #111;
    }

    body[data-theme="cyber"] {
      --bg: #020617;
      --text: #d1fae5;
      --muted: #86efac;
      --card: rgba(0,255,128,0.08);
      --card-hover: rgba(0,255,128,0.16);
      --border: rgba(34,197,94,0.45);
      --accent: #22c55e;
      --radius: 8px;
      --avatar-radius: 18px;
      --shadow: 0 0 30px rgba(34,197,94,0.28);
    }

    body[data-theme="clean"] {
      --bg: #f7f7f2;
      --text: #111827;
      --muted: #6b7280;
      --card: #fff;
      --card-hover: #f1f5f9;
      --border: #e5e7eb;
      --accent: #111827;
      --radius: 18px;
      --avatar-radius: 26px;
      --shadow: 0 18px 40px rgba(0,0,0,0.08);
    }

    body[data-theme="sunset"] {
      --bg: #2b1055;
      --text: #fff;
      --muted: #f8d7ff;
      --card: rgba(255,255,255,0.12);
      --card-hover: rgba(255,255,255,0.22);
      --border: rgba(255,255,255,0.2);
      --accent: #ff7a59;
      --radius: 28px;
      --avatar-radius: 50%;
      --shadow: 0 20px 50px rgba(255,122,89,0.25);
    }

    /* ================= BASE ================= */

    * {margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,Segoe UI,Roboto;}
    body {
      min-height:100vh;
      display:flex;
      justify-content:center;
      padding:28px 18px;
      background:var(--bg);
      color:var(--text);
    }

    .container {
      width:100%;
      max-width:450px;
      text-align:center;
    }

    /* PROFILE */

    .avatar {
      width:110px;
      height:110px;
      border-radius:var(--avatar-radius);
      object-fit:cover;
      border:3px solid var(--border);
      box-shadow:var(--shadow);
      margin-bottom:12px;
    }

    .upload-label {
      display:inline-block;
      margin-bottom:18px;
      font-size:12px;
      border:1px solid var(--border);
      background:var(--card);
      padding:8px 12px;
      border-radius:999px;
      cursor:pointer;
    }

    #photoUpload {display:none;}

    h1 {font-size:26px;margin-bottom:6px;}
    .handle {color:var(--muted);margin-bottom:10px;}
    .bio {color:var(--muted);font-size:14px;margin-bottom:20px;}

    /* THEMES */

    .theme-switcher {
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:8px;
      margin-bottom:20px;
    }

    .theme-btn {
      padding:6px;
      border-radius:999px;
      border:1px solid var(--border);
      background:var(--card);
      cursor:pointer;
      font-size:10px;
    }

    /* LINKS */

    .links {display:flex;flex-direction:column;gap:12px;}

    .link {
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:16px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      text-decoration:none;
      color:var(--link-text,var(--text));
      font-weight:700;
      box-shadow:var(--shadow);
    }

    .link:hover {
      transform:translateY(-2px);
      background:var(--card-hover);
      border-color:var(--accent);
    }

    .link-left {
      display:flex;
      align-items:center;
      gap:10px;
    }

    .logo svg {
      width:22px;
      height:22px;
      fill:currentColor;
    }

    .footer {
      margin-top:24px;
      color:var(--muted);
      font-size:12px;
    }
  </style>
</head>

<body data-theme="midnight">

<div class="container">

  <img id="avatar" class="avatar" src="profile.jpg"/>

  <br>

  <label class="upload-label" for="photoUpload">Upload photo</label>
  <input id="photoUpload" type="file" accept="image/*"/>

  <h1>Mahir Ahmed</h1>
  <p class="handle">@mahirahmed691</p>
  <p class="bio">Platform Engineer • DevOps</p>

  <div class="theme-switcher">
    <button onclick="setTheme('midnight')">Midnight</button>
    <button onclick="setTheme('linktree')">Linktree</button>
    <button onclick="setTheme('cyber')">Cyber</button>
    <button onclick="setTheme('clean')">Clean</button>
    <button onclick="setTheme('sunset')">Sunset</button>
  </div>

  <div id="links" class="links"></div>

  <div class="footer">© 2026 Mahir Ahmed</div>

</div>

<script>
const icons = {
  github:`<svg viewBox="0 0 24 24"><path d="M12 .5C5.6.5.5 5.6.5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.3.8-.6v-2.2c-3.2.7-3.9-1.3-3.9-1.3-.5-1.3-1.3-1.6-1.3-1.6-1-.7.1-.7.1-.7 1.1.1 1.7 1.2 1.7 1.2 1 1.7 2.7 1.2 3.3.9.1-.7.4-1.2.7-1.5-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3 0 0 1-.3 3.2 1.2.9-.2 1.9-.3 2.9-.3s2 .1 2.9.3c2.2-1.5 3.2-1.2 3.2-1.2.6 1.5.2 2.7.1 3 .8.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.3.8 1 .8 2v3c0 .3.2.7.8.6A11.5 11.5 0 0023.5 12C23.5 5.6 18.4.5 12 .5z"/></svg>`,
  linkedin:`<svg viewBox="0 0 24 24"><path d="M2.5 1C1.1 1 0 2.1 0 3.5S1.1 6 2.5 6 5 4.9 5 3.5 3.9 1 2.5 1zM0 8h5v15H0V8zm8 0h4v2h.1c.6-1 2-2 4-2 4 0 5 3 5 7v8h-5v-7c0-2-.1-4-2.5-4s-3 2-3 4v7H8V8z"/></svg>`,
  instagram:`<svg viewBox="0 0 24 24"><path d="M7.5 2h9A5.5 5.5 0 0122 7.5v9A5.5 5.5 0 0116.5 22h-9A5.5 5.5 0 012 16.5v-9A5.5 5.5 0 017.5 2zm0 2A3.5 3.5 0 004 7.5v9A3.5 3.5 0 007.5 20h9a3.5 3.5 0 003.5-3.5v-9A3.5 3.5 0 0016.5 4h-9z"/></svg>`,
  email:`<svg viewBox="0 0 24 24"><path d="M3 5h18a2 2 0 012 2v10a2 2 0 01-2 2H3a2 2 0 01-2-2V7a2 2 0 012-2zm9 7L3 7v10h18V7l-9 5z"/></svg>`
};

const links = [
  {title:"GitHub",url:"https://github.com/mahirahmed691",icon:icons.github},
  {title:"LinkedIn",url:"https://www.linkedin.com/in/mahir-ahmed-84a346149",icon:icons.linkedin},
  {title:"Instagram",url:"https://www.instagram.com/mahirahmed691",icon:icons.instagram},
  {title:"Contact",url:"mailto:mahirahmed691@gmail.com",icon:icons.email}
];

const container = document.getElementById("links");

links.forEach(link=>{
  const a=document.createElement("a");
  a.className="link";
  a.href=link.url;
  a.target="_blank";
  a.innerHTML=`<span class="link-left"><span class="logo">${link.icon}</span>${link.title}</span><span>→</span>`;
  a.onclick=()=>gtag("event","link_click",{link_name:link.title});
  container.appendChild(a);
});

function setTheme(t){
  document.body.dataset.theme=t;
  localStorage.setItem("theme",t);
}

setTheme(localStorage.getItem("theme")||"midnight");

const avatar=document.getElementById("avatar");
const upload=document.getElementById("photoUpload");

const saved=localStorage.getItem("photo");
if(saved) avatar.src=saved;

upload.onchange=e=>{
  const file=e.target.files[0];
  const reader=new FileReader();
  reader.onload=()=>{
    avatar.src=reader.result;
    localStorage.setItem("photo",reader.result);
  };
  reader.readAsDataURL(file);
};
</script>

</body>
</html>
