<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mahir Ahmed</title>

  <style>
    /* ===== THEMES ===== */
    body[data-theme="dark"] {
      --bg: #0f0f10;
      --card: #1a1a1d;
      --card-hover: #222226;
      --text: #ffffff;
      --muted: #a1a1aa;
      --accent: #6366f1;
      --accent-2: #a855f7;
      --border: #27272a;
    }

    body[data-theme="light"] {
      --bg: #f7f7fb;
      --card: #ffffff;
      --card-hover: #f1f1f5;
      --text: #18181b;
      --muted: #71717a;
      --accent: #6366f1;
      --accent-2: #7c3aed;
      --border: #e4e4e7;
    }

    body[data-theme="purple"] {
      --bg: #16091f;
      --card: #241031;
      --card-hover: #301542;
      --text: #ffffff;
      --muted: #c4b5d9;
      --accent: #c026d3;
      --accent-2: #9333ea;
      --border: #4a1d66;
    }

    body[data-theme="green"] {
      --bg: #07130d;
      --card: #102018;
      --card-hover: #172d22;
      --text: #ffffff;
      --muted: #a7b8ae;
      --accent: #22c55e;
      --accent-2: #14b8a6;
      --border: #214532;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      transition: all 0.3s ease;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(10px);}
      to {opacity: 1; transform: translateY(0);}
    }

    /* ===== PROFILE ===== */
    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 16px;
      border: 2px solid var(--border);
      box-shadow: 0 0 15px rgba(99,102,241,0.4);
    }

    h1 {
      font-size: 22px;
    }

    .handle {
      color: var(--muted);
      margin-bottom: 10px;
    }

    .bio {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 20px;
    }

    /* ===== THEME SWITCHER ===== */
    .theme-switcher {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .theme-switcher button {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
    }

    .theme-switcher button:hover {
      border-color: var(--accent);
    }

    /* ===== LINKS ===== */
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link {
      background: var(--card);
      padding: 14px;
      border-radius: 12px;
      text-decoration: none;
      color: var(--text);
      display: flex;
      justify-content: space-between;
      border: 1px solid var(--border);
      transition: 0.2s;
    }

    .link:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      background: var(--card-hover);
    }

    .featured {
      border-color: var(--accent);
      box-shadow: 0 0 12px rgba(99,102,241,0.3);
    }

    /* ===== FEATURES ===== */
    .features {
      margin-top: 24px;
      text-align: left;
      background: rgba(255,255,255,0.03);
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .features h2 {
      margin-bottom: 12px;
    }

    .feature-group {
      margin-bottom: 12px;
    }

    .feature-group h3 {
      color: var(--accent-2);
      font-size: 14px;
    }

    .feature-item {
      font-size: 13px;
      margin-top: 4px;
    }

    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>

<body data-theme="dark">

  <div class="container">

    <!-- 🔥 Your Instagram photo -->
    <img class="avatar" src="profile.jpg" alt="Mahir Ahmed" />

    <h1>Mahir Ahmed</h1>
    <p class="handle">@mahirahmed691</p>
    <p class="bio">Platform Engineer • DevOps • Building things that scale</p>

    <!-- Theme Switcher -->
    <div class="theme-switcher">
      <button onclick="setTheme('dark')">Dark</button>
      <button onclick="setTheme('light')">Light</button>
      <button onclick="setTheme('purple')">Purple</button>
      <button onclick="setTheme('green')">Green</button>
    </div>

    <!-- Links -->
    <div class="links" id="links"></div>

    <!-- Features -->
    <div class="features">
      <h2>Features</h2>

      <div class="feature-group">
        <h3>Link in Bio</h3>
        <div class="feature-item">✅ Comprehensive analytics</div>
      </div>

      <div class="feature-group">
        <h3>Growth Tools</h3>
        <div class="feature-item">✅ Social posts</div>
        <div class="feature-item">✅ Instagram DMs</div>
      </div>

      <div class="feature-group">
        <h3>Make Money</h3>
        <div class="feature-item">✅ Affiliate shop</div>
      </div>

      <div class="feature-group">
        <h3>Priority Support</h3>
        <div class="feature-item">✅ Contact / onboarding</div>
      </div>
    </div>

    <div class="footer">
      © 2026 Mahir Ahmed
    </div>

  </div>

  <script>
    const links = [
      {
        title: "GitHub",
        url: "https://github.com/mahirahmed691",
        featured: true
      },
      {
        title: "LinkedIn",
        url: "https://www.linkedin.com/in/mahir-ahmed-84a346149"
      },
      {
        title: "Contact Me",
        url: "mailto:mahirahmed691@gmail.com"
      }
    ];

    const container = document.getElementById("links");

    links.forEach(link => {
      const a = document.createElement("a");
      a.className = link.featured ? "link featured" : "link";
      a.href = link.url;
      a.target = link.url.startsWith("mailto:") ? "_self" : "_blank";
      a.innerHTML = `${link.title} <span>→</span>`;
      container.appendChild(a);
    });

    function setTheme(theme) {
      document.body.dataset.theme = theme;
      localStorage.setItem("theme", theme);
    }

    const savedTheme = localStorage.getItem("theme") || "dark";
    setTheme(savedTheme);
  </script>

</body>
</html>
