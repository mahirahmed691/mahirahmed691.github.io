<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-RDM6PMJJJC"></script>
  <script>

  <style>
    * {
      margin: 0; padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 52px 16px 72px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #0f0520;
      overflow-x: hidden;
    }

    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: linear-gradient(135deg, #0f0520 0%, #1a0636 50%, #0d1a40 100%);
      overflow: hidden;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.55;
      animation: drift linear infinite;
    }

    .orb-1 { width: 420px; height: 420px; background: #7c3aed; top: -100px; left: -80px; animation-duration: 18s; }
    .orb-2 { width: 320px; height: 320px; background: #db2777; top: 30%; right: -60px; animation-duration: 22s; animation-delay: -8s; }
    .orb-3 { width: 260px; height: 260px; background: #4f46e5; bottom: 10%; left: 20%; animation-duration: 26s; animation-delay: -4s; }

    @keyframes drift {
      0%   { transform: translateY(0px) scale(1); }
      50%  { transform: translateY(40px) scale(1.08); }
      100% { transform: translateY(0px) scale(1); }
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .profile {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 32px;
      animation: fadeDown 0.6s cubic-bezier(.22,1,.36,1) both;
    }

    .avatar-ring {
      padding: 3px;
      border-radius: 50%;
      background: linear-gradient(135deg, #a855f7, #ec4899, #6366f1);
      margin-bottom: 16px;
      box-shadow: 0 0 32px rgba(168,85,247,0.5);
    }

    .avatar {
      display: block;
      width: 88px;
      height: 88px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #0f0520;
    }

    h1 {
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.4px;
      margin-bottom: 6px;
    }

    .handle {
      font-size: 13px;
      color: rgba(255,255,255,0.45);
      margin-bottom: 8px;
    }

    .bio {
      font-size: 14px;
      color: rgba(255,255,255,0.7);
      text-align: center;
      line-height: 1.6;
      max-width: 280px;
    }

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .link {
      width: 100%;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 16px;
      padding: 14px 18px;
      display: grid;
      grid-template-columns: 40px 1fr 24px;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: #fff;
      font-weight: 600;
      font-size: 15px;
      transition: background 0.2s, border-color 0.2s, transform 0.15s, box-shadow 0.2s;
      animation: fadeUp 0.5s cubic-bezier(.22,1,.36,1) both;
      cursor: pointer;
    }

    .link:hover {
      background: rgba(255,255,255,0.13);
      border-color: rgba(255,255,255,0.22);
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }

    .link:active { transform: scale(0.98); }

    .link-icon-wrap {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .link-icon-wrap svg { width: 20px; height: 20px; fill: #fff; }

    .link-label { text-align: left; }

    .link-arrow {
      color: rgba(255,255,255,0.3);
      font-size: 18px;
      line-height: 1;
      transition: color 0.2s, transform 0.2s;
    }

    .link:hover .link-arrow {
      color: rgba(255,255,255,0.7);
      transform: translateX(2px);
    }

    .link[data-brand="github"]    .link-icon-wrap { background: #24292e; }
    .link[data-brand="linkedin"]  .link-icon-wrap { background: #0a66c2; }
    .link[data-brand="instagram"] .link-icon-wrap { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fd5949 45%, #d6249f 60%, #285aeb 90%); }
    .link[data-brand="email"]     .link-icon-wrap { background: #ea4335; }
    .link[data-brand="share"]     .link-icon-wrap { background: #6366f1; }

    .link[data-brand="github"]:hover   { border-color: rgba(36,41,46,0.6); }
    .link[data-brand="linkedin"]:hover { border-color: rgba(10,102,194,0.5); }
    .link[data-brand="email"]:hover    { border-color: rgba(234,67,53,0.5); }
    .link[data-brand="share"]:hover    { border-color: rgba(99,102,241,0.5); }

    .socials {
      display: flex;
      gap: 14px;
      margin-top: 28px;
      animation: fadeUp 0.5s cubic-bezier(.22,1,.36,1) 0.45s both;
    }

    .social-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.6);
      text-decoration: none;
      transition: background 0.2s, color 0.2s, transform 0.15s, border-color 0.2s;
    }

    .social-btn svg { width: 18px; height: 18px; fill: currentColor; }

    .social-btn:hover {
      background: rgba(255,255,255,0.15);
      color: #fff;
      border-color: rgba(255,255,255,0.25);
      transform: translateY(-2px);
    }

    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      padding: 10px 22px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.25s, transform 0.25s;
      pointer-events: none;
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>
  <div class="bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <main class="container">

    <section class="profile">
      <div class="avatar-ring">
        <img class="avatar" src="profile.jpg" alt="Mahir Ahmed"
             onerror="this.src='https://ui-avatars.com/api/?name=Mahir+Ahmed&background=7c3aed&color=fff&size=88';" />
      </div>
      <h1>Mahir Ahmed</h1>
      <p class="handle">@mahirahmed691</p>
      <p class="bio">Platform Engineer · DevOps · Building things that scale</p>
    </section>

    <section class="links" id="links"></section>

    <div class="socials" id="socials"></div>

  </main>

  <script>
    const EMAIL    = "mahirahmed691@gmail.com";
    const SITE_URL = "https://mahirahmed691.github.io";

    const ICONS = {
      github: `<svg viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.44 9.8 8.21 11.39.6.11.82-.26.82-.58v-2.03c-3.34.73-4.04-1.61-4.04-1.61-.54-1.38-1.33-1.75-1.33-1.75-1.09-.74.08-.73.08-.73 1.2.09 1.84 1.24 1.84 1.24 1.07 1.83 2.8 1.3 3.49 1 .11-.78.42-1.3.76-1.6-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.13-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 013-.4c1.02.005 2.04.14 3 .4 2.28-1.55 3.29-1.23 3.29-1.23.66 1.66.25 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.63-5.48 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.7.83.58C20.57 21.8 24 17.3 24 12c0-6.63-5.37-12-12-12z"/></svg>`,
      linkedin: `<svg viewBox="0 0 24 24"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.13 1.45-2.13 2.94v5.67H9.37V9h3.41v1.56h.05c.47-.9 1.63-1.85 3.36-1.85 3.59 0 4.26 2.36 4.26 5.43v6.31zM5.34 7.43a2.06 2.06 0 110-4.12 2.06 2.06 0 010 4.12zm1.78 13.02H3.56V9h3.56v11.45zM22.23 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.46c.98 0 1.77-.77 1.77-1.72V1.72C24 .77 23.21 0 22.23 0z"/></svg>`,
      instagram: `<svg viewBox="0 0 24 24"><path d="M12 2.16c3.2 0 3.58.01 4.85.07 3.25.15 4.77 1.69 4.92 4.92.06 1.27.07 1.65.07 4.85 0 3.2-.01 3.58-.07 4.85-.15 3.23-1.66 4.77-4.92 4.92-1.27.06-1.64.07-4.85.07-3.2 0-3.58-.01-4.85-.07-3.26-.15-4.77-1.7-4.92-4.92C2.17 15.58 2.16 15.2 2.16 12c0-3.2.01-3.58.07-4.85C2.38 3.86 3.9 2.31 7.15 2.23 8.42 2.17 8.8 2.16 12 2.16zM12 0C8.74 0 8.33.01 7.05.07 2.7.27.27 2.7.07 7.05.01 8.33 0 8.74 0 12c0 3.26.01 3.67.07 4.95.2 4.36 2.62 6.78 6.98 6.98C8.33 23.99 8.74 24 12 24c3.26 0 3.67-.01 4.95-.07 4.35-.2 6.78-2.62 6.98-6.98.06-1.28.07-1.69.07-4.95 0-3.26-.01-3.67-.07-4.95C23.73 2.71 21.31.27 16.95.07 15.67.01 15.26 0 12 0zm0 5.84a6.16 6.16 0 100 12.32A6.16 6.16 0 0012 5.84zM12 16a4 4 0 110-8 4 4 0 010 8zm6.4-11.85a1.44 1.44 0 100 2.88 1.44 1.44 0 000-2.88z"/></svg>`,
      email: `<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>`,
      share: `<svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>`,
    };

    const links = [
      { label: "GitHub",    brand: "github",    url: "https://github.com/mahirahmed691" },
      { label: "LinkedIn",  brand: "linkedin",  url: "https://linkedin.com/in/mahirahmed691" },
      { label: "Instagram", brand: "instagram", url: "https://instagram.com/mahirahmed691" },
      { label: "Email Me",  brand: "email",     url: "mailto:" + EMAIL },
      { label: "Share",     brand: "share",     action: sharePage },
    ];

    const socials = [
      { label: "GitHub",    brand: "github",    url: "https://github.com/mahirahmed691" },
      { label: "LinkedIn",  brand: "linkedin",  url: "https://linkedin.com/in/mahirahmed691" },
      { label: "Instagram", brand: "instagram", url: "https://instagram.com/mahirahmed691" },
    ];

    function renderLinks() {
      const c = document.getElementById("links");
      links.forEach((item, i) => {
        const a = document.createElement("a");
        a.className = "link";
        a.dataset.brand = item.brand;
        a.style.animationDelay = `${i * 0.07 + 0.1}s`;
        if (item.action) {
          a.href = "#";
          a.addEventListener("click", e => { e.preventDefault(); item.action(); });
        } else {
          a.href = item.url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
        }
        a.innerHTML = `
          <span class="link-icon-wrap">${ICONS[item.brand]}</span>
          <span class="link-label">${item.label}</span>
          <span class="link-arrow">›</span>`;
        c.appendChild(a);
      });
    }

    function renderSocials() {
      const c = document.getElementById("socials");
      socials.forEach(s => {
        const a = document.createElement("a");
        a.className = "social-btn";
        a.href = s.url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.setAttribute("aria-label", s.label);
        a.innerHTML = ICONS[s.brand];
        c.appendChild(a);
      });
    }

    function showToast(msg) {
      document.querySelector(".toast")?.remove();
      const t = document.createElement("div");
      t.className = "toast";
      t.textContent = msg;
      document.body.appendChild(t);
      requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add("show")));
      setTimeout(() => { t.classList.remove("show"); setTimeout(() => t.remove(), 300); }, 2200);
    }

    function sharePage() {
      navigator.clipboard.writeText(SITE_URL).then(() => showToast("Link copied to clipboard"));
    }

    renderLinks();
    renderSocials();
  </script>
</body>
</html>
