<!DOCTYPE html>
<html lang="en">
<head>

  <!-- Analytics -->

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 48px 16px 64px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #6b21a8 0%, #a855f7 40%, #ec4899 100%);
      background-attachment: fixed;
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .profile {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 28px;
      animation: fadeDown 0.5s ease both;
    }

    .avatar-wrap {
      position: relative;
      width: 96px;
      height: 96px;
      margin-bottom: 14px;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255,255,255,0.9);
      box-shadow: 0 0 0 3px rgba(255,255,255,0.3);
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.3px;
      margin-bottom: 6px;
    }

    .bio {
      font-size: 14px;
      color: rgba(255,255,255,0.8);
      text-align: center;
      line-height: 1.5;
      max-width: 300px;
    }

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link {
      width: 100%;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: none;
      border-radius: 50px;
      padding: 15px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      color: #1a1a1a;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
      position: relative;
      animation: fadeUp 0.5s ease both;
    }

    .link:hover {
      transform: scale(1.03);
      background: #fff;
      box-shadow: 0 6px 24px rgba(0,0,0,0.2);
    }

    .link:active {
      transform: scale(0.98);
    }

    .link-icon {
      position: absolute;
      left: 20px;
      font-size: 18px;
      line-height: 1;
    }

    .socials {
      display: flex;
      gap: 20px;
      margin-top: 28px;
      animation: fadeUp 0.5s ease 0.4s both;
    }

    .social-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-decoration: none;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .social-icon:hover {
      background: rgba(255,255,255,0.35);
      transform: scale(1.1);
    }

    .social-icon svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: rgba(0,0,0,0.75);
      color: #fff;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: none;
      backdrop-filter: blur(8px);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>
  <main class="container">

    <section class="profile">
      <div class="avatar-wrap">
        <img class="avatar" src="profile.jpg" alt="Mahir Ahmed"
             onerror="this.src='https://ui-avatars.com/api/?name=Mahir+Ahmed&background=6b21a8&color=fff&size=96';" />
      </div>
      <h1>Mahir Ahmed</h1>
      <p class="bio">Platform Engineer · DevOps · Building things that scale</p>
    </section>

    <section class="links" id="links"></section>

    <div class="socials" id="socials"></div>

  </main>

  <script>
    const EMAIL = "mahirahmed691@gmail.com";
    const SHARE_URL = "https://mahirahmed691.github.io";

    const links = [
      { title: "GitHub",     icon: "🐙", url: "https://github.com/mahirahmed691" },
      { title: "LinkedIn",   icon: "💼", url: "https://linkedin.com/in/mahirahmed691" },
      { title: "Instagram",  icon: "📸", url: "https://instagram.com/mahirahmed691" },
      { title: "Contact Me", icon: "✉️", url: "mailto:" + EMAIL },
      { title: "Share Page", icon: "🔗", action: sharePage },
    ];

    const socials = [
      {
        label: "GitHub",
        url: "https://github.com/mahirahmed691",
        svg: `<svg viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.44 9.8 8.21 11.39.6.11.82-.26.82-.58v-2.03c-3.34.73-4.04-1.61-4.04-1.61-.54-1.38-1.33-1.75-1.33-1.75-1.09-.74.08-.73.08-.73 1.2.09 1.84 1.24 1.84 1.24 1.07 1.83 2.8 1.3 3.49 1 .11-.78.42-1.3.76-1.6-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.13-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 013-.4c1.02.005 2.04.14 3 .4 2.28-1.55 3.29-1.23 3.29-1.23.66 1.66.25 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.63-5.48 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.7.83.58C20.57 21.8 24 17.3 24 12c0-6.63-5.37-12-12-12z"/></svg>`
      },
      {
        label: "LinkedIn",
        url: "https://linkedin.com/in/mahirahmed691",
        svg: `<svg viewBox="0 0 24 24"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.13 1.45-2.13 2.94v5.67H9.37V9h3.41v1.56h.05c.47-.9 1.63-1.85 3.36-1.85 3.59 0 4.26 2.36 4.26 5.43v6.31zM5.34 7.43a2.06 2.06 0 110-4.12 2.06 2.06 0 010 4.12zm1.78 13.02H3.56V9h3.56v11.45zM22.23 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.46c.98 0 1.77-.77 1.77-1.72V1.72C24 .77 23.21 0 22.23 0z"/></svg>`
      },
      {
        label: "Instagram",
        url: "https://instagram.com/mahirahmed691",
        svg: `<svg viewBox="0 0 24 24"><path d="M12 2.16c3.2 0 3.58.01 4.85.07 3.25.15 4.77 1.69 4.92 4.92.06 1.27.07 1.65.07 4.85 0 3.2-.01 3.58-.07 4.85-.15 3.23-1.66 4.77-4.92 4.92-1.27.06-1.64.07-4.85.07-3.2 0-3.58-.01-4.85-.07-3.26-.15-4.77-1.7-4.92-4.92C2.17 15.58 2.16 15.2 2.16 12c0-3.2.01-3.58.07-4.85C2.38 3.86 3.9 2.31 7.15 2.23 8.42 2.17 8.8 2.16 12 2.16zM12 0C8.74 0 8.33.01 7.05.07 2.7.27.27 2.7.07 7.05.01 8.33 0 8.74 0 12c0 3.26.01 3.67.07 4.95.2 4.36 2.62 6.78 6.98 6.98C8.33 23.99 8.74 24 12 24c3.26 0 3.67-.01 4.95-.07 4.35-.2 6.78-2.62 6.98-6.98.06-1.28.07-1.69.07-4.95 0-3.26-.01-3.67-.07-4.95C23.73 2.71 21.31.27 16.95.07 15.67.01 15.26 0 12 0zm0 5.84a6.16 6.16 0 100 12.32A6.16 6.16 0 0012 5.84zM12 16a4 4 0 110-8 4 4 0 010 8zm6.4-11.85a1.44 1.44 0 100 2.88 1.44 1.44 0 000-2.88z"/></svg>`
      },
    ];

    function renderLinks() {
      const container = document.getElementById("links");
      links.forEach((link, i) => {
        const a = document.createElement("a");
        a.className = "link";
        a.style.animationDelay = `${i * 0.07 + 0.15}s`;

        if (link.action) {
          a.href = "#";
          a.addEventListener("click", e => { e.preventDefault(); link.action(); });
        } else {
          a.href = link.url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
        }

        a.innerHTML = `<span class="link-icon">${link.icon}</span>${link.title}`;
        container.appendChild(a);
      });
    }

    function renderSocials() {
      const container = document.getElementById("socials");
      socials.forEach(s => {
        const a = document.createElement("a");
        a.className = "social-icon";
        a.href = s.url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.setAttribute("aria-label", s.label);
        a.innerHTML = s.svg;
        container.appendChild(a);
      });
    }

    function showToast(msg) {
      const existing = document.querySelector(".toast");
      if (existing) existing.remove();
      const t = document.createElement("div");
      t.className = "toast";
      t.textContent = msg;
      document.body.appendChild(t);
      requestAnimationFrame(() => { requestAnimationFrame(() => t.classList.add("show")); });
      setTimeout(() => { t.classList.remove("show"); setTimeout(() => t.remove(), 300); }, 2000);
    }

    function sharePage() {
      navigator.clipboard.writeText(SHARE_URL).then(() => showToast("Link copied!"));
    }

    renderLinks();
    renderSocials();
  </script>
</body>
</html>
