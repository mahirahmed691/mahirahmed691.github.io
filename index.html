<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mahir Ahmed</title>

  <style>
    :root {
      --bg: #0f0f10;
      --card: #1a1a1d;
      --text: #ffffff;
      --muted: #a1a1aa;
      --accent: #6366f1;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 24px;
      text-align: center;
      opacity: 0;
      transform: translateY(10px);
      animation: fadeIn 0.6s ease forwards;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .profile {
      margin-bottom: 32px;
    }

    .avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      margin-bottom: 16px;
      object-fit: cover;
      border: 2px solid #27272a;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 6px;
    }

    .bio {
      color: var(--muted);
      font-size: 14px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link {
      background: var(--card);
      padding: 14px 16px;
      border-radius: 12px;
      text-decoration: none;
      color: var(--text);
      font-weight: 500;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s ease;
      border: 1px solid transparent;
    }

    .link:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .link span {
      color: var(--muted);
      font-size: 13px;
    }

    .footer {
      margin-top: 28px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="profile">
      <!-- 🔥 Replace this with your image -->
      <img class="avatar" src="https://via.placeholder.com/150" alt="Mahir Ahmed" />

      <h1>Mahir Ahmed</h1>
      <p class="bio">Platform Engineer • DevOps • Building things that scale</p>
    </div>

    <div class="links">

      <a class="link" href="https://github.com/YOUR_USERNAME" target="_blank" onclick="track('GitHub')">
        GitHub <span>→</span>
      </a>

      <a class="link" href="https://linkedin.com/in/YOUR_PROFILE" target="_blank" onclick="track('LinkedIn')">
        LinkedIn <span>→</span>
      </a>

      <a class="link" href="#" onclick="track('What I’m Building')">
        What I’m Building <span>→</span>
      </a>

      <a class="link" href="mailto:your@email.com" onclick="track('Contact')">
        Contact Me <span>→</span>
      </a>

    </div>

    <div class="footer">
      © 2026 Mahir Ahmed
    </div>

  </div>

  <script>
    function track(linkName) {
      console.log("Clicked:", linkName);
    }
  </script>

</body>
</html>
