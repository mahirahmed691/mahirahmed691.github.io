<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Mahir Ahmed | Links</title>

  <!-- 🔥 Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-RDM6PMJJJC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());
    gtag("config", "G-RDM6PMJJJC");
  </script>

  <style>
    body[data-theme="midnight"] {
      --bg: #050505;
      --bg-glow: rgba(99, 102, 241, 0.35);
      --card: rgba(255,255,255,0.08);
      --card-hover: rgba(255,255,255,0.14);
      --text: #ffffff;
      --muted: #a1a1aa;
      --accent: #8b5cf6;
      --accent-2: #6366f1;
      --border: rgba(255,255,255,0.14);
    }

    body[data-theme="linktree"] {
      --bg: #39e09b;
      --bg-glow: rgba(255,255,255,0.35);
      --card: #111;
      --card-hover: #242424;
      --text: #111;
      --link-text: #fff;
      --muted: #174632;
      --accent: #111;
      --accent-2: #111;
      --border: rgba(0,0,0,0.18);
    }

    * {margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,Segoe UI,Roboto;}
    body {
      min-height:100vh;
      background:radial-gradient(circle at top,var(--bg-glow),transparent 35%),var(--bg);
      color:var(--text);
      display:flex;
      justify-content:center;
      padding:28px 18px;
    }

    .container {max-width:440px;width:100%;text-align:center;}

    .avatar {
      width:100px;height:100px;border-radius:50%;
      margin:0 auto 16px;
      object-fit:cover;
      border:3px solid var(--border);
    }

    h1 {font-size:24px;}
    .handle {color:var(--muted);margin-bottom:10px;}
    .bio {color:var(--muted);margin-bottom:20px;font-size:14px;}

    .theme-switcher {
      display:flex;gap:8px;justify-content:center;margin-bottom:20px;
    }

    .theme-btn {
      padding:6px 10px;
      border-radius:999px;
      border:1px solid var(--border);
      background:var(--card);
      cursor:pointer;
      font-size:12px;
    }

    .links {display:flex;flex-direction:column;gap:12px;}

    .link {
      background:var(--card);
      padding:14px;
      border-radius:14px;
      text-decoration:none;
      color:var(--link-text,var(--text));
      display:flex;
      justify-content:space-between;
      border:1px solid var(--border);
    }

    .link:hover {border-color:var(--accent);}

    .footer {margin-top:20px;font-size:12px;color:var(--muted);}
  </style>
</head>

<body data-theme="midnight">

<div class="container">

  <img class="avatar" src="profile.jpg" />

  <h1>Mahir Ahmed</h1>
  <p class="handle">@mahirahmed691</p>
  <p class="bio">Platform Engineer • DevOps</p>

  <div class="theme-switcher">
    <button class="theme-btn" onclick="setTheme('midnight')">Midnight</button>
    <button class="theme-btn" onclick="setTheme('linktree')">Linktree</button>
  </div>

  <div class="links" id="links"></div>

  <div class="footer">© 2026 Mahir Ahmed</div>

</div>

<script>
const links = [
  { title:"GitHub", url:"https://github.com/mahirahmed691" },
  { title:"LinkedIn", url:"https://www.linkedin.com/in/mahir-ahmed-84a346149" },
  { title:"Instagram", url:"https://www.instagram.com/mahirahmed691" },
  { title:"Contact Me", url:"mailto:mahirahmed691@gmail.com" }
];

const container = document.getElementById("links");

links.forEach(link => {
  const a = document.createElement("a");
  a.className = "link";
  a.href = link.url;
  a.target = link.url.startsWith("mailto:") ? "_self" : "_blank";

  a.innerHTML = `${link.title} <span>→</span>`;

  a.addEventListener("click", () => {
    if (typeof gtag === "function") {
      gtag("event", "link_click", {
        link_name: link.title
      });
    }
  });

  container.appendChild(a);
});

function setTheme(theme){
  document.body.dataset.theme = theme;
  localStorage.setItem("theme", theme);
}

const savedTheme = localStorage.getItem("theme") || "midnight";
setTheme(savedTheme);
</script>

</body>
</html>
